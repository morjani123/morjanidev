name: Capture real application screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/capture-project-screenshots.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture real public demos
        run: |
          mkdir -p assets/screenshots
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const apps=[
              ['chantier-manager-pro','https://morjani123.github.io/chantier-manager-pro/'],
              ['fleet-manager-pro','https://morjani123.github.io/fleet-manager-pro/'],
              ['health-service','https://morjani123.github.io/health-service/'],
              ['gestion-commerciale-pro','https://morjani123.github.io/gestion-commerciale-pro/'],
              ['react-optisis','https://morjani123.github.io/react-optisis/'],
              ['onssa','https://www.onssa.gov.ma/'],
              ['cri-fes-meknes','https://fesmeknesinvest.ma/'],
              ['laayoune-invest','https://laayouneinvest.ma/'],
              ['amee','https://amee.ma/'],
              ['map','https://www.map.ma/']
            ];
            for(const [slug,url] of apps){
              const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
              try{
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                if(!response || !response.ok())throw Error('HTTP '+response?.status());
                const title=(await page.title()).toLowerCase();
                if(/access denied|just a moment|captcha|403 forbidden/.test(title))throw Error('Site blocked automated access');
                await page.waitForTimeout(2500);
                await page.screenshot({path:'assets/screenshots/'+slug+'.png',animations:'disabled'});
                console.log('Captured '+slug);
              }catch(e){console.warn('Screenshot unavailable '+slug+': '+e.message)}
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Commit captured images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: real screenshots from published application demos"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Screenshots published successfully"
                exit 0
              fi
              echo "Concurrent push detected; retrying ($attempt/5)"
              sleep 3
            done
            echo "Could not publish screenshots after five attempts"
            exit 1
          fi
